name: Sample package check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify sample and ZIP
        run: python3 scripts/verify_sample.py
      - name: Verify permissions practice ZIP
        run: python3 scripts/verify_permissions_sample.py
      - name: Verify rewind practice ZIP and comparison cases
        run: python3 scripts/verify_rewind_sample.py
      - name: Verify synthetic media ZIP and headers
        run: python3 scripts/verify_media_sample.py
      - name: Verify read-only hash comparison ZIP and cases
        run: python3 scripts/verify_hash_sample.py
      - name: Verify Premiere generation preparation ZIP without generating
        run: python3 scripts/verify_premiere_generative_sample.py
      - name: Verify practical note sample ZIP and SRT structural boundaries
        run: python3 scripts/verify_note_practical_samples.py
